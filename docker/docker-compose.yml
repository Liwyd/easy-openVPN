# =============================================================================
# eovpanel — Production Docker Compose
# =============================================================================
#
# Quick start:
#   1. cp ../.env.example ../.env   (edit with your settings)
#   2. docker compose pull
#   3. docker compose up -d
#   4. Open http://localhost (or https://localhost if TLS is configured)
#
# Services:
#   - backend:  FastAPI API + Alembic migrations + APScheduler
#   - frontend: React SPA served by nginx (reverse proxy to backend)
#
# OpenVPN runs on the HOST (not in Docker). The backend needs access to:
#   - /etc/openvpn/          — server config, certs, easy-rsa, CCD directory
#   - /run/openvpn/          — management socket for live status + client control
#
# These host paths are created by vpn-core's setup_server.sh on the host.
#
# TLS modes:
#   (a) No TLS (default) — HTTP only on PANEL_PORT (default 8000).
#       Fine for local/behind-VPN. Marzban-style single panel port.
#   (b) Certs from erfjab/ESSL — mount to /etc/nginx/ssl/ in frontend service;
#       HTTPS on PANEL_SSL_PORT (default 443), HTTP redirects to HTTPS.
#   (c) External reverse proxy (Caddy/Traefik) — this compose works behind it.
#
# Postgres alternative:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
#
# Image version:
#   Set IMAGE_TAG in your .env to pin a specific version (default: latest).
#   IMAGE_TAG=latest docker compose pull && docker compose up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Backend — FastAPI + Alembic + APScheduler
  # ---------------------------------------------------------------------------
  backend:
    image: ${DOCKERHUB_USERNAME:-liwyd}/easy-openvpn-backend:${IMAGE_TAG:-latest}
    container_name: eovpanel-backend
    restart: unless-stopped
    env_file:
      - ../.env
    # No host port mapping — the backend is handled internally by the frontend
    # nginx (Marzban-style). Re-add e.g. "127.0.0.1:8000:8000" for debugging.
    volumes:
      # OpenVPN server config, certs, easy-rsa, CCD directory (read/write)
      - /etc/openvpn:/etc/openvpn:rw
      # Management socket for live client status and control commands.
      # Must be :rw because the backend sends management commands (kill, status).
      - /run/openvpn:/run/openvpn:rw
      # SQLite data persistence (named volume, ignored when using Postgres)
      - eovpanel_data:/app/data
    networks:
      - eovpanel
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ---------------------------------------------------------------------------
  # Frontend — React SPA + nginx reverse proxy
  # ---------------------------------------------------------------------------
  frontend:
    image: ${DOCKERHUB_USERNAME:-liwyd}/easy-openvpn-frontend:${IMAGE_TAG:-latest}
    container_name: eovpanel-frontend
    restart: unless-stopped
    ports:
      # Marzban-style: a single configurable port serves the panel + API +
      # subscriptions; the backend is proxied internally (no host mapping).
      - "${PANEL_PORT:-8000}:80"
      - "${PANEL_SSL_PORT:-443}:443"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - eovpanel
    # --- TLS (optional) ---
    # To enable TLS with certs from erfjab/ESSL, uncomment and adjust:
    # volumes:
    #   - /etc/letsencrypt/live/yourdomain.com:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

# ---------------------------------------------------------------------------
# Named volumes
# ---------------------------------------------------------------------------
volumes:
  eovpanel_data:
    # Persists the SQLite database across container restarts.
    # Ignored when using PostgreSQL (docker-compose.postgres.yml).

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  eovpanel:
    driver: bridge
