[project]
name = "eovpanel-backend"
version = "0.1.0"
description = "eovpanel backend — OpenVPN management panel API"
requires-python = ">=3.12"
license = {text = "MIT"}
readme = "README.md"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0",
    "python-decouple>=3.8",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "apscheduler>=3.10.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "python-telegram-bot>=21.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "black>=24.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = [
    "B008",   # FastAPI Depends() in function signatures (idiomatic)
    "F821",   # Forward references in SQLAlchemy models (from __future__ import annotations)
    "UP042",  # str, enum.Enum vs StrEnum (style choice)
    "SIM102", # collapsible-if — nested ifs are clearer for quota guards
]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
